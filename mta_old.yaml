_schema-version: '3.1'
ID: schoolmanagement
version: 1.0.0
description: A simple CAP project.
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
  subdomain: build-qa-udmt39c2

build-parameters:
  before-all:
    - builder: custom
      commands:
        - rm -rf build/dist
        - mkdir -p build/dist
        - rm -rf build/ui-deployer
        - mkdir -p build/ui-deployer
    - builder: custom
      commands:
        # - npm install --production
        # - >-
        #   bash -c "cds -v | grep 'cds-dk' || npm i --production --no-save
        #   @sap/cds-dk"
        # - bash -c "export PATH=$PATH:$(pwd)/node_modules/.bin"
        # - cds build --production
        - npm install --no-save @sap/cds-dk
        # - export PATH=$PATH:$(pwd)/node_modules/.bin
        # - cds build --production
        - npx cds build --production

  # after-all:
  #   - builder: custom
  #     commands:
  #       - npm install

        
modules:
  - name: schoolmanagement-schoolstudentmanagement
    type: html5
    path: app/school-student-management
    build-parameters:
      builder: custom
      # commands:
      #   - rm -rf dist-zip dist
      #   - npm install
      #   - >-
      #     npx -p @ui5/cli@^3.0.0 ui5 build --dest dist
      #     --include-task=generateCachebusterInfo
      #   - mkdir dist-zip
      #   - >-
      #     bash -c "cd dist && npx bestzip
      #     ../dist-zip/schoolstudentmanagement.zip *"
      commands:
        - rm -rf dist
        - npm install
        # - npx -p @ui5/cli@^3.0.0 ui5 build --dest dist --include-task=generateCachebusterInfo
        # - npx -p @ui5/cli@^3.0.0 ui5 build --dest dist
        # - npx ui5 build --all --dest dist
        # - npx -p @ui5/cli@^3.0.0 ui5 build --dest dist --include-task=generateComponentPreload --include-task=generateCachebusterInfo
        # - npx -p @ui5/cli@^3.0.0 ui5 build --dest dist --clean-dest
        - npx ui5 build --dest dist --clean-dest --include-task=generateComponentPreload --include-task=generateCachebusterInfo
        # - npx -p @ui5/cli@^3.0.0 ui5 build --dest dist --clean-dest --config ui5.yaml
        - mkdir p dist-zip
        # - bash -c "cd dist && npx bestzip ../dist-zip/schoolstudentmanagement.zip *"     
        # - bash -c "cd dist && npx bestzip ../dist-zip/schoolstudentmanagement.zip ." 
        - bash -c "cd dist && npx bestzip ../dist-zip/schoolstudentmanagement.zip schoolstudentmanagement"
        # - bash -c "mkdir -p dist-zip && cd dist && npx bestzip ../dist-zip/schoolstudentmanagement.zip *"
      # _artifactName: schoolstudentmanagement.zip
      supported-platforms: []
      build-result: dist-zip
      # build-result: dist



  - name: schoolmanagement-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm
      ignore:
        - node_modules
        - package-lock.json
    requires:
      - name: schoolmanagement-service-uaa
      - name: schoolmanagement-service-db


  - name: schoolmanagement-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 256MB
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    build-parameters:
      builder: npm
      ignore:
        - node_modules
        - package-lock.json
    requires:
      - name: schoolmanagement-service-uaa
      - name: schoolmanagement-service-db
      - name: schoolmanagement-service-destination
      - name: schoolmanagement-service-metadata
      - name: schoolmanagement-service-connectivity
      - name: schoolmanagement-service-logs


  - name: schoolmanagement-aux-destinations
    type: com.sap.application.content
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Authentication: OAuth2UserTokenExchange
              Name: schoolmanagement-service-uaa
              ServiceInstanceName: schoolmanagement-uaa
              ServiceKeyName: schoolmanagement-uaa-key
              sap.cloud.service: lcap.schoolmanagement

            - Authentication: OAuth2UserTokenExchange
              Name: schoolmanagement-app-srv
              TokenServiceInstanceName: schoolmanagement-uaa
              TokenServiceKeyName: schoolmanagement-uaa-key
              URL: ~{srv-api/srv-url}
              sap.cloud.service: lcap.schoolmanagement

            - Name: schoolmanagement-service-html5-apps-repo-host
              ServiceInstanceName: schoolmanagement-html5-apps-repo-host
              ServiceKeyName: schoolmanagement-html5-apps-repo-host-key
              sap.cloud.service: lcap.schoolmanagement

            # - Authentication: OAuth2UserTokenExchange
            #   Name: schoolmanagement-schoolmanagementSrv
            #   TokenServiceInstanceName: schoolmanagement-uaa
            #   TokenServiceKeyName: schoolmanagement-uaa-key
            #   URL: ~{srv-api/srv-url}/service/schoolmanagement
            #   sap.cloud.service: lcap.schoolmanagement
            #   sap.applicationdevelopment.actions.enabled: false
            #   sap.build.usage: CAP
            #   sap.processautomation.enabled: false
            #   HTML5.DynamicDestination: false
            #   WebIDEEnabled: false
            #   MobileEnabled: false
            #   AppgyverEnabled: false
    build-parameters:
      no-source: true
    requires:
      - name: schoolmanagement-service-uaa
        parameters:
          service-key:
            name: schoolmanagement-uaa-key
      - name: srv-api
      - name: schoolmanagement-service-html5-apps-repo-host
        parameters:
          service-key:
            name: schoolmanagement-html5-apps-repo-host-key
      - name: schoolmanagement-service-destination
        parameters:
          content-target: true


  - name: schoolmanagement-launchpad
    type: html5
    path: build/launchpad
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npx -p @ui5/cli@^3.0.0 ui5 build --dest dist --include-task=generateCachebusterInfo
        - mkdir dist-zip
        - bash -c "cd dist && npx bestzip ../dist-zip/launchpad.zip *"
        # - bash -c "cd dist && npx bestzip ../../../build/dist/launchpad.zip *"
        # - rm -rf dist
      # _artifactName: launchpad.zip
      supported-platforms: []
      # build-result: ../../build/dist
      # build-result: dist
      build-result: dist-zip


  - name: schoolmanagement-aux-ui-deployer
    type: com.sap.application.content
    path: build/ui-deployer
    # path: .

    build-parameters:
      build-result: resources
      requires:
        # - name: schoolmanagement-service-html5-apps-repo-host
        #   parameters:
        #     content-target: true

        - name: schoolmanagement-schoolstudentmanagement
          artifacts:
            - schoolstudentmanagement.zip
          target-path: resources

        - name: schoolmanagement-launchpad
          artifacts:
            - launchpad.zip
          target-path: resources

    requires:

      - name: schoolmanagement-service-html5-apps-repo-host
        parameters:
          content-target: true

      # - name: schoolmanagement-service-html5-apps-repo-runtime

 



resources:

  - type: org.cloudfoundry.managed-service
    name: schoolmanagement-service-uaa
    parameters:
      service: xsuaa
      service-plan: application
      service-name: schoolmanagement-uaa
      path: xs-security.json
      config:
        oauth2-configuration:
          redirect-uris:
            - https://${subdomain}.launchpad.${default-domain}/login/*
            - https://${subdomain}.${default-domain}/login/*
          credential-types:
            - binding-secret
            - x509
        xsappname: schoolmanagement-${space}
        role-collections: []


  - type: org.cloudfoundry.managed-service
    name: schoolmanagement-service-db
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: schoolmanagement-db
  - type: org.cloudfoundry.managed-service
    name: schoolmanagement-service-destination
    parameters:
      service: destination
      service-plan: lite
      service-name: schoolmanagement-destination
      config:
        HTML5Runtime_enabled: true
        version: 1.0.0


  - type: org.cloudfoundry.user-provided-service
    name: schoolmanagement-service-metadata
    parameters:
      service: metadata
      service-plan: standard
      service-name: schoolmanagement-metadata
      config:
        default-domain: ${default-domain}


  - type: org.cloudfoundry.managed-service
    name: schoolmanagement-service-connectivity
    parameters:
      service: connectivity
      service-plan: lite
      service-name: schoolmanagement-connectivity


  - type: org.cloudfoundry.managed-service
    name: schoolmanagement-service-logs
    parameters:
      service: application-logs
      service-plan: lite
      service-name: schoolmanagement-logs


  - type: org.cloudfoundry.managed-service
    name: schoolmanagement-service-html5-apps-repo-host
    parameters:
      service: html5-apps-repo
      service-plan: app-host
      service-name: schoolmanagement-html5-apps-repo-host

  - type: org.cloudfoundry.managed-service
    name: schoolmanagement-service-html5-apps-repo-runtime
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
      service-name: schoolmanagement-html5-apps-repo-runtime

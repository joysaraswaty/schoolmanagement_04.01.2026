_schema-version: 3.3.0
ID: schoolmanagement
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: schoolmanagement-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 512M
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: schoolmanagement-auth
      - name: schoolmanagement-db
      - name: schoolmanagement-destination

  - name: schoolmanagement-db-deployer
    type: hdb
    path: gen/db
    parameters:
      memory: 256M
      disk-quota: 256M
      buildpack: nodejs_buildpack
    requires:
      - name: schoolmanagement-db

  - name: schoolmanagement-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: schoolmanagement-auth
      - name: srv-api
      - name: schoolmanagement-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    build-parameters:
      build-result: app/
      requires:
        - name: schoolmanagementschoolstudentmanagement
          artifacts:
            - school-student-management.zip
          target-path: app/

  - name: schoolmanagementschoolstudentmanagement
    type: html5
    path: app/school-student-management
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: schoolmanagement-destinations
    type: com.sap.application.content
    requires:
      - name: schoolmanagement-auth
        parameters:
          service-key:
            name: schoolmanagement-auth-key
      - name: schoolmanagement-html5-repo-host
        parameters:
          service-key:
            name: schoolmanagement-html5-repo-host-key
      - name: srv-api
      - name: schoolmanagement-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: schoolmanagement-html5-repository
              ServiceInstanceName: schoolmanagement-html5-repo-host
              ServiceKeyName: schoolmanagement-html5-repo-host-key
              sap.cloud.service: schoolmanagement.service
            - Name: schoolmanagement-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: schoolmanagement-auth
              ServiceKeyName: schoolmanagement-auth-key
              sap.cloud.service: schoolmanagement.service

  - name: schoolmanagement
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 128M
    requires:
      # - name: srv-api
      #   group: destinations
      #   properties:
      #     name: srv-api # must be used in xs-app.json as well
      #     url: ~{srv-url}
      #     forwardAuthToken: true
      - name: schoolmanagement-auth
      - name: schoolmanagement-destination
      - name: schoolmanagement-html5-runtime
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: schoolmanagement-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: schoolmanagement-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          redirect-uris:
            - https://*~{app-api/app-uri}/**
    requires:
      - name: app-api
  - name: schoolmanagement-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: schoolmanagement-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                # URL: ~{srv-api/srv-url}
                URL: https://~{app-api/app-uri}
                # Authentication: NoAuthentication
                Authentication: OAuth2UserTokenExchange
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
    requires:
      - name: srv-api
    #     group: destinations
    #     properties:
    #       name: srv-api # must be used in xs-app.json as well
    #       url: ~{srv-url}
    #       forwardAuthToken: true

  - name: schoolmanagement-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: schoolmanagement-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
